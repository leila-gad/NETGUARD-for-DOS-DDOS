services:

  dos-detector:
    build:
      context: ..
      dockerfile: deployment/Dockerfile

    container_name: dos-detector-api
    image: dos-detector:latest

    ports:
      - "5000:5000"

    volumes:
      - logs_data:/app/logs

    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
